name: Build Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: mvn clean package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: ContainerNotifier
          path: |
            target/ContainerNotifier-*.jar
            !target/original-*.jar
